<style id="s-entree">
:root{--bg:#f3f1ec;--card:#fbfaf7;--ink:#262a28;--soft:#6f746f;--line:#dcd9d1;--field:#f0eee8;--accent:#3f7a66;--bad:#a3423a}
@media (prefers-color-scheme:dark){:root{--bg:#1a1c1b;--card:#232624;--ink:#e9e7e1;--soft:#a2a69f;--line:#363a37;--field:#2b2e2c;--accent:#86c3ab;--bad:#e3908a;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.5 "Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
#entree{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 18px}
#entree form{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 22px 22px}
#entree h1{font:500 30px/1.15 "Literata",Georgia,"Times New Roman",serif;margin:0 0 4px;letter-spacing:-.012em}
#entree svg{width:44px;height:44px;display:block}
#entree p{margin:0 0 18px;color:var(--soft);font-size:15px}
#entree label{display:block;font-size:15px;font-weight:600;margin-bottom:6px}
#entree input[type=password]{width:100%;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;color:var(--ink);outline:none}
#entree input[type=password]:focus{border-color:var(--accent)}
#entree .garder{display:flex;gap:10px;align-items:center;margin:14px 0 18px;font-weight:400}
#entree .garder input{width:20px;height:20px;accent-color:var(--accent);flex:none}
#entree button{width:100%;background:var(--accent);color:#fff;border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:600;cursor:pointer}
@media (prefers-color-scheme:dark){#entree button{color:#12201a}}
#entree button:disabled{opacity:.6;cursor:default}
#entree button:focus-visible,#entree input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#tableau{display:block;width:calc(100% + 44px);max-width:none;margin:-26px -22px 20px;aspect-ratio:16/10;object-fit:cover;border-radius:17px 17px 0 0;background:var(--field)}
#entree #cartel{margin:16px 0 0;font-size:13px;color:var(--soft)}
#entree #cartel i{color:var(--ink)}
#msg{min-height:22px;margin:12px 0 0;font-size:15px;color:var(--bad)}
</style>
</head>

  window.__verrouiller=function(){try{localStorage.removeItem(CLE);}catch(e){} location.reload();};
  if(!(window.crypto&&crypto.subtle)){ $('msg').textContent='Cette page doit être ouverte en https.'; $('go').disabled=true; return; }
  // Clé gardée sur cet appareil : ouverture directe.
  (async function(){ var k=null; try{k=localStorage.getItem(CLE);}catch(e){} if(!k) return;
    try{ afficher(await ouvrir(b64(k))); }catch(e){ try{localStorage.removeItem(CLE);}catch(_){} } })();
  $('f').addEventListener('submit',async function(ev){ ev.preventDefault();
    var go=$('go'),msg=$('msg'); msg.textContent=''; go.disabled=true; go.textContent='Ouverture…';
    try{ var raw=await derive($('pw').value); var doc=await ouvrir(raw);
      if($('garder').checked){ try{localStorage.setItem(CLE,to64(raw));}catch(e){} }
      afficher(doc);
    }catch(e){ msg.textContent='Ce mot de passe n’ouvre pas la page.'; go.disabled=false; go.textContent='Ouvrir'; $('pw').select(); }
  });
})();
